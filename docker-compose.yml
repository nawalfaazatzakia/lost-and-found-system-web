services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lostfound-app
    volumes:
      - ./:/var/www
    working_dir: /var/www
    networks:
      - app-network

  artisan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lostfound-artisan
    volumes:
      - ./:/var/www
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: lostfound-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - artisan
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: lostfound-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lostfound
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network: