services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: lostfound-app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        container_name: lostfound-nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - app-network

    mysql:
        image: mysql:8.0
        container_name: lostfound-mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: lostfound
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - app-network

volumes:
    mysql_data:

networks:
    app-network:
